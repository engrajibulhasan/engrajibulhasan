<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none" role="img" aria-label="MD. Rajibul Hasan - Senior Software Engineer - TypeScript, Next.js, Express.js, MongoDB, MySQL">
  <defs>
    <linearGradient id="accentBarL" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#087EA4"/>
      <stop offset="55%" stop-color="#0969DA"/>
      <stop offset="80%" stop-color="#087EA4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
