      <stop offset="50%" stop-color="#087EA4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#087EA4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#087EA4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#087EA4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsL" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0d1117" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="cardL">
      <rect x="1" y="1" width="998" height="278" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardL)">
    <rect width="1000" height="280" fill="#FFFFFF"/>
    <rect width="1000" height="280" fill="url(#dotsL)"/>
    <ellipse cx="500" cy="118" rx="470" ry="150" fill="url(#glowL)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <rect width="1000" height="4" fill="url(#accentBarL)"/>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="16" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>

  <g stroke="#087EA4" stroke-opacity="0.45" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M22 54 V34 H42"/>
    <path d="M978 54 V34 H958"/>
    <path d="M22 226 V246 H42"/>
    <path d="M978 226 V246 H958"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="66" font-size="13" font-weight="600" letter-spacing="4.5" fill="#087EA4">SENIOR SOFTWARE ENGINEER</text>
    <text x="500" y="128" font-size="54" font-weight="800" letter-spacing="2" fill="#0D1117">MD. RAJIBUL HASAN</text>
  </g>

  <rect x="430" y="150" width="140" height="2" rx="1" fill="url(#ruleL)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <text x="500" y="186" font-size="16" fill="#57606A">TypeScript &#183; Next.js &#183; Express.js &#183; MongoDB &#183; MySQL</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.2">
    <rect x="269" y="208" width="180" height="30" rx="15" fill="#087EA4" fill-opacity="0.08" stroke="#087EA4" stroke-opacity="0.35"/>
    <text x="359" y="227.5" fill="#0A6E8F">10+ YEARS EXPERIENCE</text>

    <rect x="465" y="208" width="110" height="30" rx="15" fill="#087EA4" fill-opacity="0.08" stroke="#087EA4" stroke-opacity="0.35"/>
    <text x="520" y="227.5" fill="#0A6E8F">SSO &amp; MFA</text>

    <rect x="591" y="208" width="140" height="30" rx="15" fill="#1A7F37" fill-opacity="0.10" stroke="#1A7F37" stroke-opacity="0.40"/>
